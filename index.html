<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảo Ngân có yêu Mạnh Đức không?</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            --bg1: #ffd9e8;
            --bg2: #fff0f6;
            --card: rgba(255, 255, 255, 0.88);
            --primary: #ff4f87;
            --primary-dark: #e63d75;
            --text: #333;
            --muted: #666;
            --border: #ffd0df;
            --success: #1f9d55;
            --shadow: 0 20px 50px rgba(255, 79, 135, 0.18);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-yes {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 79, 135, 0.4);
        }

        .btn-yes:hover {
            background-color: var(--primary-dark);
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #f0f0f0;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bảo Ngân có yêu Mạnh Đức không? ❤️</h1>
        <div class="btn-group">
            <button class="btn-yes" onclick="alert('Mạnh Đức cũng yêu Bảo Ngân rất nhiều! 🥰')">Có chứ! ❤️</button>
            <button class="btn-no" id="btnNo">Không 😜</button>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btnNo');
        btnNo.addEventListener('mouseover', () => {
            const x = Math.floor(Math.random() * (window.innerWidth - btnNo.offsetWidth));
            const y = Math.floor(Math.random() * (window.innerHeight - btnNo.offsetHeight));
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;
        });
    </script>
</body>
</html>
